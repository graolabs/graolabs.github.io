<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grão Labs</title>
<meta name="description" content="Grão Labs makes apps for Mac, iPad and iPhone.">
<style>
  :root {
    --bg: #fbfaf7;
    --text: #1f1d1a;
    --muted: #6b665e;
    --rule: #e4e0d8;
    --accent: #3f6b4a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513;
      --text: #ece9e3;
      --muted: #a39d93;
      --rule: #34312c;
      --accent: #8fbf98;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513;
    --text: #ece9e3;
    --muted: #a39d93;
    --rule: #34312c;
    --accent: #8fbf98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 72px 16px; }
  h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 48px; }
  h2 { font-size: 1.2rem; margin: 0 0 4px; }
  .app { padding: 20px 0; border-top: 1px solid var(--rule); }
  .app p { margin: 4px 0; }
  a { color: var(--accent); }
  footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Grão Labs</h1>
  <p class="lede">Apps for Mac, iPad and iPhone.</p>

  <section class="app">
    <h2>Carry Notes</h2>
    <p>Carries a large collection of notes from one app to another, without ever touching the original.
      Every change is previewed before it runs and can be undone after. In beta on the Mac.</p>
    <p><a href="/carrynotes/privacy/">Privacy policy</a></p>
  </section>

  <footer>Contact: <a href="mailto:graolabs@gmail.com">graolabs@gmail.com</a></footer>
</main>
</body>
</html>
